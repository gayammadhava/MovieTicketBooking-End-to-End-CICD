name: MovieTicketBooking CD Pipeline

on:
  workflow_run:
    workflows:
      - MovieTicketBooking CI
    types:
      - completed

  workflow_dispatch:

jobs:
  deploy:
   if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configure Maven Settings
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          mkdir -p ~/.m2

          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>${NEXUS_USERNAME}</username>
                <password>${NEXUS_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Download WAR from Nexus
        env:
          NEXUS_HOST_URL: ${{ secrets.NEXUS_HOST_URL }}
        run: |
          mvn org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy \
            -Dartifact=com.movieticket:MovieTicketBooking:1.0.0-SNAPSHOT:war \
            -DoutputDirectory=target/nexus-download \
            -DremoteRepositories=nexus::default::${NEXUS_HOST_URL}/repository/maven-snapshots/ \
            -Dtransitive=false

      - name: Verify Downloaded WAR
        run: |
          echo "Checking downloaded WAR file..."

          ls -lh target/nexus-download/

          test -f target/nexus-download/MovieTicketBooking-1.0.0-SNAPSHOT.war

          echo "WAR file downloaded successfully!"

      - name: Deploy WAR to Tomcat
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL }}
          TOMCAT_USERNAME: ${{ secrets.TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          curl --fail --show-error \
            --user "$TOMCAT_USERNAME:$TOMCAT_PASSWORD" \
            --upload-file target/nexus-download/MovieTicketBooking-1.0.0-SNAPSHOT.war \
            "$TOMCAT_URL/manager/text/deploy?path=/MovieTicketBooking&update=true"

      - name: Verify Tomcat Deployment
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL }}
          TOMCAT_USERNAME: ${{ secrets.TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          echo "Checking Tomcat deployment..."

          curl -f "$TOMCAT_URL/MovieTicketBooking/"

      - name: Deployment Successful
        run: echo "MovieTicketBooking deployed successfully to Tomcat!"

name: MovieTicketBooking CD Pipeline

on:
  workflow_run:
    workflows:
      - MovieTicketBooking CI
    types:
      - completed

  workflow_dispatch:

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Maven Settings
        run: |
          mkdir -p ~/.m2

          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Download WAR from Nexus
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
        run: |
          mvn org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
            -Dartifact=com.movieticket:MovieTicketBooking:1.0.0-SNAPSHOT:war \
            -DremoteRepositories=nexus::default::${NEXUS_URL}/repository/maven-snapshots/ \
            -Dtransitive=false

          mkdir -p target/nexus-download

          cp ~/.m2/repository/com/movieticket/MovieTicketBooking/1.0.0-SNAPSHOT/MovieTicketBooking-1.0.0-SNAPSHOT.war \
             target/nexus-download/

      - name: Verify WAR
        run: |
          ls -lh target/nexus-download/
          test -s target/nexus-download/MovieTicketBooking-1.0.0-SNAPSHOT.war

      - name: Deploy to Tomcat
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL }}
          TOMCAT_USERNAME: ${{ secrets.TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          curl --fail --show-error \
            --user "$TOMCAT_USERNAME:$TOMCAT_PASSWORD" \
            --upload-file target/nexus-download/MovieTicketBooking-1.0.0-SNAPSHOT.war \
            "$TOMCAT_URL/manager/text/deploy?path=/MovieTicketBooking&update=true"

      - name: Verify Tomcat Deployment
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL }}
        run: |
          sleep 5
          curl --fail "$TOMCAT_URL/MovieTicketBooking/"
          echo "Deployment successful!"
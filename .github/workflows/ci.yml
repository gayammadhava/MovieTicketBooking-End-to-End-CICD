
name: MovieTicketBooking CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/workflows/**.yml
      - .gitignore

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Perform Maven Tests
        run: mvn -B clean test

      - name: Test SonarQube Quality Gate
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B test org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.projectKey=MovieTicketBooking \
            -Dsonar.qualitygate.wait=true

      - name: Generate WAR File
        run: mvn -B clean package -DskipTests

      - name: Configure Maven Settings
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          mkdir -p ~/.m2

          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>${NEXUS_USERNAME}</username>
                <password>${NEXUS_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy WAR to Nexus Repository
        env:
          NEXUS_HOST_URL: ${{ secrets.NEXUS_HOST_URL }}
        run: |
          mvn org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            -DgroupId=com.movieticket \
            -DartifactId=MovieTicketBooking \
            -Dversion=1.0.0-SNAPSHOT \
            -Dpackaging=war \
            -Dfile=target/MovieTicketBooking.war \
            -DrepositoryId=nexus \
            -Durl="${NEXUS_HOST_URL}/repository/maven-snapshots/"

      - name: Artifact is deployed to Nexus Repository
        run: echo "Artifact deployed successfully to Nexus Repository"
